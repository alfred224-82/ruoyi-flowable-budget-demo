<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
  <!-- PWA 元信息：主题色 / iOS 全屏 / 桌面标题（无论 PWA_ENABLED 开关状态都保留，避免启用后重复声明） -->
  <meta name="theme-color" content="#1565C0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="资金管控" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- PWA 占位符：由 vite.config.js 的 pwaAssetsPlugin.transformIndexHtml 按 PWA_ENABLED 开关注入
       - 开关打开（构建设 VITE_PWA_ENABLED=true）：注入 <link rel="manifest"> + SW 注册脚本
       - 开关关闭（当前默认）：manifest 替换为空；SW 占位符注入「注销残留 SW + 清 caches」清理脚本 -->
  <!-- %PWA_MANIFEST% -->
  <!-- PWA: 图标（多尺寸兼容，非 PWA 场景下也用作 favicon / apple-touch-icon） -->
  <link rel="icon" type="image/png" sizes="192x192" href="/h5/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/h5/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/h5/icon-192.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/h5/icon-152.png" />
  <title>资金管控系统</title>
  <!-- ★html-to-image（19KB gzip）+ html2canvas（45KB gzip）：share-image-generator / activity-poster 截图分享库 -->
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!--preload-links-->
  <!--app-context-->
</head>
<body>
  <div id="app"><!--app-html--></div>
  <script type="module" src="/src/main.js"></script>
  <!-- PWA 占位符：见 head 中说明，由 vite.config.js 按 PWA_ENABLED 开关注入 SW 注册脚本或清理脚本 -->
  <!-- %PWA_SW% -->

</body>
</html>
