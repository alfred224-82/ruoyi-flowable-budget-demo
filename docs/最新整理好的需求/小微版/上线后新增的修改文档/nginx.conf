worker_processes  1;
events {
    worker_connections  1024;
}
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

    upstream server {
        server 127.0.0.1:8080;
    }

    # ========== 80端口：全部跳转HTTPS ==========
    server {
        listen       80;
        server_name  118.89.133.114 localhost xiaozhangben.com.cn www.xiaozhangben.com.cn;
        return 301 https://$host$request_uri;
    }

    # ========== 443 HTTPS 主服务块，所有业务逻辑放这里 ==========
    server {
        listen       443 ssl;
        server_name  118.89.133.114 localhost xiaozhangben.com.cn www.xiaozhangben.com.cn;

        ssl_certificate     cert/xiaozhangben.com.cn_bundle.crt;
        ssl_certificate_key cert/xiaozhangben.com.cn.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        # 解决登录循环跳转、后端识别https
        proxy_set_header X-Forwarded-Proto $scheme;

        # 拦截 actuator 端点
        location ~ ^(/[^/]*)?/actuator(/.*)?$ {
            return 403;
        }

        # ====================== XA Job 9100 访问路径 /job ======================
        # xxl-job-admin 的 context-path 为 /xxl-job-admin，必须原样代理该前缀（不能 rewrite 剥离），
        # 否则登录页内的绝对链接与静态资源(/xxl-job-admin/...)会 404
        location /xxl-job-admin {
            proxy_pass http://127.0.0.1:9100;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_cookie_path / "/; SameSite=Lax";
        }
        # 短路径 /job 跳转到真实上下文（登录 admin / 123456）
        location = /job {
            return 302 /xxl-job-admin/;
        }

        # ====================== monitor监控 9090 访问路径 /monitor ======================
        # spring-boot-admin 的 context-path 为 /admin，必须原样代理该前缀
        location /admin {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_cookie_path / "/; SameSite=Lax";
        }
        # 短路径 /monitor 跳转到真实上下文（登录 ruoyi / 123456）
        location = /monitor {
            return 302 /admin/;
        }

        # ========== H5移动端页面：https://xxx/h5 ==========
        # PWA: sw.js 必须 no-cache，否则浏览器会长期沿用旧 Service Worker，更新无法生效
        location = /h5/sw.js {
            root   C:/tools/ruoyi-demo/nginx;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/h5/";
        }
        # PWA: index.html 必须 no-store。否则 iOS/微信会对无缓存头的 HTML 做启发式缓存，
        # 手机长期拿到旧 HTML → 引用旧 hash JS → 新功能“PC 正常、手机不生效”
        location = /h5/index.html {
            root   C:/tools/ruoyi-demo/nginx;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }
        # PWA: manifest 必须以 application/manifest+json 返回，否则浏览器拒绝解析、无法「添加到主屏幕」
        location = /h5/manifest.webmanifest {
            root   C:/tools/ruoyi-demo/nginx;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }
        location /h5/ {
            root   C:/tools/ruoyi-demo/nginx;
            index  index.html index.htm;
            try_files $uri $uri/ /h5/index.html;
        }

        # ========== PC后台管理系统 主页面 ==========
        location / {
            root   C:/tools/ruoyi-demo/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # ========== MinIO OSS反代 /oss/ ==========
        location /oss/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_pass http://127.0.0.1:9000/;
        }

        # ========== 后端API /prod-api/ ==========
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://server/;
        }
    }
}
