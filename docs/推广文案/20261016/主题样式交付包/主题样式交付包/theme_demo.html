<!DOCTYPE html>
<html lang="zh-CN" data-theme="t1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小账本 H5 · 四主题切换演示</title>
<link rel="stylesheet" href="theme_tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .switcher{position:fixed;top:10px;right:10px;z-index:99;display:flex;gap:6px;
    background:var(--card-bg);padding:5px;border-radius:999px;box-shadow:var(--shadow-card)}
  .switcher button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;
    font-size:11px;color:#fff;font-weight:700}
  .switcher button.on{border-color:var(--brand);transform:scale(1.1)}
  .sw1{background:#4F8FF7}.sw2{background:#F5455C}.sw3{background:#0B0F19}.sw4{background:#FFB347}
  .demo{max-width:430px;margin:0 auto;padding:70px 16px 20px}

  /* ===== 装饰展示区：常驻，四主题各自表现 ===== */
  .deco-panel{background:var(--card-bg);border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);padding:16px;margin-bottom:14px;text-align:center}
  .deco-panel .cap{font-size:12px;color:var(--text-sub);margin-bottom:12px}
  .deco-row{display:flex;justify-content:center;align-items:center;gap:14px}
  .deco-row svg{width:30px;height:30px;fill:currentColor}
  .deco-panel .hint{font-size:11px;color:var(--text-sub);margin-top:12px;
    padding-top:10px;border-top:1px solid var(--border)}

  /* t1 线性描边 */
  :root[data-theme="t1"] .deco-row{color:var(--brand-2)}
  :root[data-theme="t1"] .deco-row svg{fill:none;stroke:currentColor;stroke-width:1.8}
  /* t2 圆润实心红金 */
  :root[data-theme="t2"] .deco-row{color:var(--brand-2)}
  :root[data-theme="t2"] .deco-row svg{fill:currentColor}
  /* t3 发光面状青色 */
  :root[data-theme="t3"] .deco-row{color:var(--brand-2)}
  :root[data-theme="t3"] .deco-row svg{fill:currentColor;
    filter:drop-shadow(0 0 6px rgba(0,229,255,.65))}
  /* t4 手绘涂鸦橙粉 */
  :root[data-theme="t4"] .deco-row{color:var(--brand-2)}
  :root[data-theme="t4"] .deco-row svg{fill:currentColor;transform:rotate(-4deg)}
  :root[data-theme="t4"] .deco-row svg:nth-child(even){transform:rotate(5deg)}

  /* 图标网格展示 */
  .ico-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .ico-grid div{text-align:center}
  .ico-grid svg{width:20px;height:20px;fill:currentColor;color:var(--brand)}
  .ico-grid span{display:block;font-size:9px;color:var(--text-sub);margin-top:3px}
  :root[data-theme="t1"] .ico-grid svg{fill:none;stroke:currentColor;stroke-width:1.8}
  :root[data-theme="t3"] .ico-grid svg{filter:drop-shadow(0 0 5px rgba(91,143,255,.6))}

  .btn-disabled{background:var(--border);color:var(--text-sub);
    border-radius:var(--radius-btn);height:46px;width:100%;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;cursor:not-allowed;box-shadow:none}
  .sec{margin-top:22px}
</style>
</head>
<body>

<div class="switcher">
  <button class="sw1 on" onclick="setTheme('t1',this)">1</button>
  <button class="sw2" onclick="setTheme('t2',this)">2</button>
  <button class="sw3" onclick="setTheme('t3',this)">3</button>
  <button class="sw4" onclick="setTheme('t4',this)">4</button>
</div>

<div class="page"><div class="demo">

  <!-- ===== 装饰 + 图标展示区（常驻） ===== -->
  <div class="deco-panel">
    <div class="cap">装饰图形 · 手绘贴纸（星星 / 气泡 / 云朵 / 爱心）</div>
    <div class="deco-row">
      <svg><use href="#d-star"/></svg>
      <svg><use href="#d-bubble"/></svg>
      <svg><use href="#d-cloud"/></svg>
      <svg><use href="#d-heart"/></svg>
    </div>
    <div class="ico-grid">
      <div><svg><use href="#i-home"/></svg><span>发现</span></div>
      <div><svg><use href="#i-activity"/></svg><span>活动</span></div>
      <div><svg><use href="#i-todo"/></svg><span>待处理</span></div>
      <div><svg><use href="#i-qrcode"/></svg><span>推广码</span></div>
      <div><svg><use href="#i-mine"/></svg><span>我的</span></div>
      <div><svg><use href="#i-workbench"/></svg><span>工作台</span></div>
      <div><svg><use href="#i-booking"/></svg><span>预约</span></div>
      <div><svg><use href="#i-setting"/></svg><span>设置</span></div>
      <div><svg><use href="#i-feedback"/></svg><span>反馈</span></div>
      <div><svg><use href="#i-logout"/></svg><span>退出</span></div>
      <div><svg><use href="#i-refresh"/></svg><span>刷新</span></div>
      <div><svg><use href="#i-location"/></svg><span>定位</span></div>
      <div><svg><use href="#i-search"/></svg><span>搜索</span></div>
      <div><svg><use href="#i-arrow"/></svg><span>箭头</span></div>
      <div><svg><use href="#i-check"/></svg><span>对勾</span></div>
      <div><svg><use href="#i-empty"/></svg><span>空态</span></div>
      <div><svg><use href="#i-empty-mail"/></svg><span>无通知</span></div>
      <div><svg><use href="#d-star"/></svg><span>星星</span></div>
    </div>
    <div class="hint">共 21 个 SVG symbol，全部内联在本页，gzip 后约 2 KB</div>
  </div>

  <!-- ===== 登录表单（对齐你的截图） ===== -->
  <div class="navbar-sys">杰杰旅游社</div>
  <div class="title" style="margin-bottom:4px">上海市</div>

  <div class="sec">
    <div class="field">
      <div class="field-label">账号</div>
      <input class="input" placeholder="请输入账号">
    </div>
    <div class="field">
      <div class="field-label">密码</div>
      <input class="input" type="password" placeholder="请输入密码">
    </div>
    <div class="check-row">
      <input type="checkbox" checked><span>记住账号</span>
    </div>
    <div style="height:14px"></div>
    <div class="btn-disabled">登 录</div>
    <div style="height:10px"></div>
    <button class="btn btn-danger">退出登录</button>
  </div>

  <!-- ===== 选择门店 ===== -->
  <div class="sec">
    <div class="card-title">选择门店</div>
    <div class="store-card on" style="margin-top:8px">
      <div class="store-logo">杰</div>
      <div class="store-meta">
        <div class="store-name">杰杰旅游社</div>
        <div class="store-sub">上海市 · 徐汇区</div>
      </div>
      <div class="store-check"><svg style="width:12px;height:12px;fill:#fff"><use href="#i-check"/></svg></div>
    </div>
    <div class="store-card">
      <div class="store-logo" style="background:var(--brand-2)">A</div>
      <div class="store-meta">
        <div class="store-name">AIA桌游店</div>
        <div class="store-sub">上海市 · 静安区</div>
      </div>
    </div>
  </div>

  <!-- ===== 今日业绩 ===== -->
  <div class="sec">
    <div class="card">
      <div class="card-title">今日业绩
        <span class="link"><svg style="width:13px;height:13px;fill:currentColor;vertical-align:-2px"><use href="#i-refresh"/></svg> 刷新</span>
      </div>
      <div class="stat-group" style="margin-top:8px">
        <div class="stat"><div class="stat-num">0</div><div class="stat-label">接单数</div></div>
        <div class="stat-divider"></div>
        <div class="stat"><div class="stat-num">¥0.00</div><div class="stat-label">营收</div></div>
        <div class="stat-divider"></div>
        <div class="stat"><div class="stat-num">-</div><div class="stat-label">平均评分</div></div>
      </div>
    </div>
  </div>

  <!-- ===== 空状态 ===== -->
  <div class="sec">
    <div class="card"><div class="empty">
      <div class="ico"><svg><use href="#i-empty-mail"/></svg></div>
      暂无预约失败通知
    </div></div>
  </div>

</div></div>

<div class="tabbar">
  <div class="tabbar-item on"><span class="ico"><svg><use href="#i-home"/></svg></span>工作台</div>
  <div class="tabbar-item"><span class="ico"><svg><use href="#i-qrcode"/></svg></span>我的推广码</div>
  <div class="tabbar-item"><span class="ico"><svg><use href="#i-mine"/></svg></span>我的</div>
</div>

<!-- ============================================================
     小账本 H5 · 图标集（SVG Sprite）
     用法：<svg class="ico"><use href="#i-home"/></svg>
     优势：矢量、可 currentColor 跟随主题变色、单文件一次请求
     体积：全部图标合计约 3 KB，gzip 后不足 1 KB
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- ===== 底部导航 ===== -->
  <!-- 发现（首页） -->
  <symbol id="i-home" viewBox="0 0 24 24">
    <path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3L12 3z"/>
  </symbol>
  <!-- 最新活动 -->
  <symbol id="i-activity" viewBox="0 0 24 24">
    <path d="M19 3h-1V1h-2v2h-8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V9h14v10z"/>
  </symbol>
  <!-- 我的待处理 -->
  <symbol id="i-todo" viewBox="0 0 24 24">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
  </symbol>
  <!-- 我的推广码 -->
  <symbol id="i-qrcode" viewBox="0 0 24 24">
    <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm12-2h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm-6 0h2v2h-2v-2zm0 4h6v2h-6v-2z"/>
  </symbol>
  <!-- 我的活动 -->
  <symbol id="i-mine" viewBox="0 0 24 24">
    <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z"/>
  </symbol>
  <!-- 工作台 -->
  <symbol id="i-workbench" viewBox="0 0 24 24">
    <path d="M3 3h8v6H3V3zm10 0h8v6h-8V3zM3 11h8v10H3V11zm10 0h8v10h-8V11z"/>
  </symbol>

  <!-- ===== 功能图标 ===== -->
  <!-- 我的预约 -->
  <symbol id="i-booking" viewBox="0 0 24 24">
    <path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14z"/>
  </symbol>
  <!-- 账号设置 -->
  <symbol id="i-setting" viewBox="0 0 24 24">
    <path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3H9l-.3 2.6c-.6.2-1.2.6-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.8 1.7 1L9 21h6l.3-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
  </symbol>
  <!-- 投诉 / 反馈 -->
  <symbol id="i-feedback" viewBox="0 0 24 24">
    <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
  </symbol>
  <!-- 退出登录 -->
  <symbol id="i-logout" viewBox="0 0 24 24">
    <path d="M17 8l-1.4 1.4 1.6 1.6H9v2h8.2l-1.6 1.6L17 16l4-4-4-4zM5 5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7v-2H5V5z"/>
  </symbol>
  <!-- 刷新 -->
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M17.6 6.4A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.4 2.4z"/>
  </symbol>
  <!-- 定位 -->
  <symbol id="i-location" viewBox="0 0 24 24">
    <path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
  </symbol>
  <!-- 搜索 -->
  <symbol id="i-search" viewBox="0 0 24 24">
    <path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
  </symbol>
  <!-- 箭头（列表项右侧） -->
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M9 6l6 6-6 6-1.4-1.4L12.2 12 7.6 7.4 9 6z"/>
  </symbol>
  <!-- 对勾（选中态） -->
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
  </symbol>

  <!-- ===== 空状态插画 ===== -->
  <!-- 暂无排班 / 暂无活动 / 暂无通知 通用 -->
  <symbol id="i-empty" viewBox="0 0 64 64">
    <path d="M12 18a6 6 0 0 1 6-6h28a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V18zm6-2h28a2 2 0 0 1 2 2v22a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V18a2 2 0 0 1 2-2z" opacity=".35"/>
    <rect x="20" y="26" width="24" height="3" rx="1.5" opacity=".5"/>
    <rect x="20" y="33" width="16" height="3" rx="1.5" opacity=".35"/>
    <circle cx="46" cy="14" r="4" opacity=".25"/>
  </symbol>
  <!-- 信封（无通知） -->
  <symbol id="i-empty-mail" viewBox="0 0 64 64">
    <path d="M10 22a4 4 0 0 1 4-4h36a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V22zm6 2 16 11 16-11" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" opacity=".55"/>
  </symbol>

  <!-- ===== 主题4 手绘装饰（可跟随 --brand-2 变色） ===== -->
  <!-- 星星 -->
  <symbol id="d-star" viewBox="0 0 24 24">
    <path d="M12 2l2.4 6.6L21 10l-5.2 4.2L17.4 21 12 17.2 6.6 21l1.6-6.8L3 10l6.6-1.4L12 2z"/>
  </symbol>
  <!-- 气泡 -->
  <symbol id="d-bubble" viewBox="0 0 24 24">
    <path d="M12 3c-5 0-9 3.1-9 7 0 2.2 1.3 4.2 3.3 5.5L5 19l3.8-1.6c1 .3 2.1.4 3.2.4 5 0 9-3.1 9-7s-4-6.8-9-6.8z"/>
  </symbol>
  <!-- 小云朵 -->
  <symbol id="d-cloud" viewBox="0 0 24 24">
    <path d="M6.5 19a4.5 4.5 0 0 1-.6-8.9 6 6 0 0 1 11.4 1.4A3.8 3.8 0 0 1 17.5 19h-11z"/>
  </symbol>
  <!-- 爱心 -->
  <symbol id="d-heart" viewBox="0 0 24 24">
    <path d="M12 21s-8-4.9-8-10.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8 3.8C20 16.1 12 21 12 21z"/>
  </symbol>

</svg>


<script>
function setTheme(t, el){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.switcher button').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
</script>

</body>
</html>
