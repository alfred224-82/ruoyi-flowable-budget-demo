--- # 监控中心配置
spring.boot.admin.client:
  # 增加客户端开关
  enabled: false
  url: http://localhost:9090/admin
  instance:
    service-host-type: IP
  username: ruoyi
  password:

--- # xxl-job 配置
xxl.job:
  # 执行器开关
  enabled: true
  # 调度中心地址：如调度中心集群部署存在多个地址则用逗号分隔。
  admin-addresses: http://localhost:9100/xxl-job-admin
  # 执行器通讯TOKEN：非空时启用
  access-token:
  executor:
    # 执行器AppName：执行器心跳注册分组依据；为空则关闭自动注册
    appname: xxl-job-executor
    # 执行器端口号 执行器从9101开始往后写
    port: 9101
    # 执行器注册：默认IP:PORT
    address:
    # 执行器IP：默认自动获取IP
    ip:
    # 执行器运行日志文件存储磁盘路径
    logpath: ./logs/xxl-job
    # 执行器日志文件保存天数：大于3生效
    logretentiondays: 30

--- # 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # 动态数据源文档 https://www.kancloud.cn/tracy5546/dynamic-datasource/content
    dynamic:
      # 性能分析插件(有性能损耗 不建议生产环境使用)
      p6spy: true
      # 设置默认的数据源或者数据源组,默认值即为 master
      primary: master
      # 严格模式 匹配不到数据源则报错
      strict: true
      datasource:
        # 主库数据源
        master:
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          # jdbc 所有参数配置参考 https://lionli.blog.csdn.net/article/details/122018562
          # rewriteBatchedStatements=true 批处理优化 大幅提升批量插入更新删除性能(对数据库有性能损耗 使用批量操作应考虑性能问题)
          url: jdbc:mysql://localhost:3306/ry-flowable-plus?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username: root
          password:
        # 从库数据源
        slave:
          lazy: true
          type: ${spring.datasource.type}
          driverClassName: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://localhost:3306/ry-flowable-plus?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&nullCatalogMeansCurrent=true
          username:
          password:
#        oracle:
#          type: ${spring.datasource.type}
#          driverClassName: oracle.jdbc.OracleDriver
#          url: jdbc:oracle:thin:@//localhost:1521/XE
#          username: ROOT
#          password:
#          hikari:
#            connectionTestQuery: SELECT 1 FROM DUAL
#        postgres:
#          type: ${spring.datasource.type}
#          driverClassName: org.postgresql.Driver
#          url: jdbc:postgresql://localhost:5432/postgres?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#          username: root
#          password:
#        sqlserver:
#          type: ${spring.datasource.type}
#          driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#          url: jdbc:sqlserver://localhost:1433;DatabaseName=tempdb;SelectMethod=cursor;encrypt=false;rewriteBatchedStatements=true
#          username: SA
#          password:
      hikari:
        # 最大连接池数量
        maxPoolSize: 20
        # 最小空闲线程数量
        minIdle: 10
        # 配置获取连接等待超时的时间
        connectionTimeout: 30000
        # 校验超时时间
        validationTimeout: 5000
        # 空闲连接存活最大时间，默认10分钟
        idleTimeout: 600000
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        maxLifetime: 1800000
        # 连接测试query（配置检测连接是否有效）
        connectionTestQuery: SELECT 1
        # 多久检查一次连接的活性
        keepaliveTime: 30000

--- # redis 单机配置(单机与集群只能开启一个另一个需要注释掉)
spring:
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码(如没有密码请注释掉)
    # password:
    # 连接超时时间
    timeout: 10s
    # 是否开启ssl
    ssl: false

redisson:
  # redis key前缀
  keyPrefix:
  # 线程池数量
  threads: 4
  # Netty线程池数量
  nettyThreads: 8
  # 单节点配置
  singleServerConfig:
    # 客户端名称
    clientName: ${ruoyi.name}
    # 最小空闲连接数
    connectionMinimumIdleSize: 8
    # 连接池大小
    connectionPoolSize: 32
    # 连接空闲超时，单位：毫秒
    idleConnectionTimeout: 10000
    # 命令等待超时，单位：毫秒
    timeout: 3000
    # 发布和订阅连接池大小
    subscriptionConnectionPoolSize: 50

--- # 线程池相关配置（供 @Async("threadPoolTaskExecutor") 与图片合规并行检测使用；enabled 必须为 true，否则 threadPoolTaskExecutor bean 不会创建，触发 NoSuchBeanDefinitionException）
thread-pool:
  # 是否开启线程池
  enabled: true
  # 队列最大长度
  queue-capacity: 128
  # 线程池维护线程所允许的空闲时间
  keep-alive-seconds: 300

--- # mail 邮件发送
mail:
  enabled: false
  host: smtp.163.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: xxx@163.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: xxx@163.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: xxxxxxxxxx
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0

--- # 预算通知配置
budget:
  # 系统访问地址（用于邮件中的操作链接）
  system-url: http://localhost:80

--- # sms 短信
sms:
  enabled: false
  # 阿里云 dysmsapi.aliyuncs.com
  # 腾讯云 sms.tencentcloudapi.com
  endpoint: "dysmsapi.aliyuncs.com"
  accessKeyId: xxxxxxx
  accessKeySecret: xxxxxx
  signName: 测试
  # 游客短信验证码模板ID（阿里云/腾讯云控制台审核通过后填入，如 SMS_1234567；enabled=true 时必填）
  visitor-template-id:
  # 开发模式验证码：云短信未开启时经 devCode 返回验证码供联调（★生产必须 false）
  dev-code-enabled: true
  # 同一手机号每日发送上限（防刷，默认 10）
  sms-day-limit: 10
  # 短信核验服务不可用时的保底开关（true=PNVS异常时6位数字直接放行；临时降级用，通道恢复后改回false）
  sms-verify-fallback-enabled: true
  # 腾讯专用
  sdkAppId:

--- # 阿里云号码认证服务 PNVS（一键登录 + 短信认证共用同一把 AccessKey 与 dypnsapi.aliyuncs.com 端点）
# ★安全：AccessKey 为敏感凭据，上线后建议到阿里云控制台轮换/重置，勿长期留存于仓库
number-auth:
  # ===== H5 一键登录（控制台已创建 H5 一键登录方案，sceneCode 就绪，启用）=====
  enabled: true
  accessKeyId:
  accessKeySecret:
  # 认证方案 Code（控制台创建 H5 一键登录方案后获取）
  sceneCode: FC220000013710116
  # 页面地址（必须与控制台方案登记一致：协议 + // + 域名 + /）
  pageUrl: https://xiaozhangben.com.cn/
  # 源地址（末尾无 /）
  origin: https://xiaozhangben.com.cn
  # ===== PNVS 短信认证（赠送签名+模板；SendSmsVerifyCode 发码 / CheckSmsVerifyCode 核验）=====
  # 对应 SMS_ENABLED：true 时游客验证码走阿里云真实下发 + 平台托管核验；false 时降级 devCode（仅 dev）
  smsEnabled: true
  # 赠送签名（控制台「赠送签名配置」页原样抄写，必须搭配赠送模板）
  smsSignName: 恒创联众
  # 赠送模板 Code（登录/注册验证码模板；字符串，勿写成数字）
  smsTemplateCode: "100001"
  smsCountryCode: "86"
  smsCodeLength: 6
  # 验证码有效期（单位：秒，300 = 5 分钟）
  smsValidTime: 300
  # 重复发送策略（1）/ 两次发送最小间隔（秒，60）
  smsDuplicatePolicy: 1
  smsInterval: 60

--- # 微信小程序（T13.1 code2session 一键登录；未配置 appid/secret 时一键登录不可用，仍可账号密码登录）
wx:
  miniapp:
    appid:
    secret:
  # 微信公众号（T13.3 模板消息/客服消息；未配置时消息发送返回 FAILED，不阻塞主流程）
  official:
    appid:
    secret:

--- # H5推广码配置（顾客手机浏览器扫码进入的登录页地址，带 ref_t/ref_u 参数用于登录后归因）
promo:
  h5-base-url: https://xiaozhangben.com.cn/h5/#/pages/login/index

--- # 企业微信自建应用（T13.3 企微应用消息；未配置时消息发送返回 FAILED，不阻塞主流程）
wecom:
  app:
    corpId:
    secret:
    agentId:

--- # 内容安全审核（M18 T18.6：文本审核已收口至统一敏感词引擎 ISensitiveWordEngine，
# 图片审核收口至 IImageComplianceService；原 content.security.blacklist 关键词黑名单配置已废弃移除。
# 微信 imgSecCheck 相关开关 content.security.img-check-enabled / img-check-fail-open 走 @Value 默认值，无需在此配置。）
